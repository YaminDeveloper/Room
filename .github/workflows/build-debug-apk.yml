name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Detect Gradle project
        id: detect
        run: |
          WRAPPER=$(find . -name gradlew -type f | head -n 1)
          if [ -n "$WRAPPER" ]; then
            echo "dir=$(dirname "$WRAPPER")" >> $GITHUB_OUTPUT
            echo "wrapper=true" >> $GITHUB_OUTPUT
          else
            SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "Error: No Gradle project found in repository."
              ls -R
              exit 1
            fi
            echo "dir=$(dirname "$SETTINGS")" >> $GITHUB_OUTPUT
            echo "wrapper=false" >> $GITHUB_OUTPUT
          fi

      - name: Build debug APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ "${{ steps.detect.outputs.wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Print build summary
        if: always()
        run: |
          echo "## Build Debug APK - Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 APK Output: build/outputs/apk/debug/" >> $GITHUB_STEP_SUMMARY
